# Application
quarkus.application.name=purchase-order-gateway
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %X %s %e%n
%dev.quarkus.http.port=8082
%dev.quarkus.http.host=0.0.0.0

# Infrastructure - by default Quarkus Dev Services start everything this service
# needs (Temporal, Grafana LGTM, and PostgreSQL/Mailpit where used), so no
# docker-compose stack is required. To run against the docker-compose stack:
#   mvn quarkus:dev -Dquarkus.profile=compose
%compose.quarkus.config.profile.parent=dev
%compose.quarkus.temporal.connection.target=${TEMPORAL_SERVER_URL:localhost:7233}
%compose.quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4317}
%compose.quarkus.observability.enabled=false

# OpenTelemetry - export all three signals, not just traces
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# Temporal Configuration
quarkus.temporal.namespace=default
quarkus.temporal.worker.task-queue=purchase-order-tasks
quarkus.temporal.workflow.workflow-task-timeout=5s
quarkus.grpc.server.use-separate-server=false

# UI
quarkus.http.enable-compression=true
quarkus.http.filter.others.header.Cache-Control=no-cache
quarkus.http.filter.others.matches=/.*
quarkus.http.filter.others.methods=GET,POST,PUT,DELETE
quarkus.http.filter.others.order=0
quarkus.servlet.direct-buffers=true