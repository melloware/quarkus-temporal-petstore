# Application
quarkus.application.name=order-service
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %X %s %e%n
%dev.quarkus.http.port=8090
%dev.quarkus.http.host=0.0.0.0

# OpenTelemetry - traces, metrics and logs are exported to the Grafana LGTM stack
# started by docker-compose (Grafana UI on http://localhost:3000). The observability
# Dev Service is turned off so each service does not start its own throwaway LGTM.
%dev.quarkus.observability.enabled=false
%test.quarkus.observability.enabled=false
quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# Temporal Configuration
quarkus.temporal.connection.target=${TEMPORAL_SERVER_URL:localhost:7233}
quarkus.temporal.namespace=default
quarkus.temporal.worker.task-queue=order-tasks
quarkus.temporal.workflow.workflow-task-timeout=15s
quarkus.grpc.server.use-separate-server=false

# Database Type
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:temporal}
quarkus.datasource.password=${POSTGRES_PASSWORD:temporal}
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.telemetry=true

#Hibernate settings
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
