# Application
quarkus.application.name=order-service
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %X %s %e%n
%dev.quarkus.http.port=8090
%dev.quarkus.http.host=0.0.0.0

# Infrastructure - by default Quarkus Dev Services start everything this service
# needs (Temporal, Grafana LGTM, and PostgreSQL/Mailpit where used), so no
# docker-compose stack is required. To run against the docker-compose stack:
#   mvn quarkus:dev -Dquarkus.profile=compose
%compose.quarkus.config.profile.parent=dev
%compose.quarkus.temporal.connection.target=${TEMPORAL_SERVER_URL:localhost:7233}
%compose.quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4317}
%compose.quarkus.observability.enabled=false

# OpenTelemetry - export all three signals, not just traces
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# Temporal Configuration
quarkus.temporal.namespace=default
quarkus.temporal.worker.task-queue=order-tasks
quarkus.temporal.workflow.workflow-task-timeout=15s
quarkus.grpc.server.use-separate-server=false

# Database - db-kind tells the Dev Service which container to start; the
# connection details only apply to the docker-compose stack.
quarkus.datasource.db-kind=postgresql
%compose.quarkus.datasource.username=${POSTGRES_USER:temporal}
%compose.quarkus.datasource.password=${POSTGRES_PASSWORD:temporal}
%compose.quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.telemetry=true

#Hibernate settings
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
