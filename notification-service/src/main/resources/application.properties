# Application
quarkus.application.name=notification-service
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %X %s %e%n
%dev.quarkus.http.port=8089
%dev.quarkus.http.host=0.0.0.0

# Infrastructure - by default Quarkus Dev Services start everything this service
# needs (Temporal, Grafana LGTM, and PostgreSQL/Mailpit where used), so no
# docker-compose stack is required. To run against the docker-compose stack:
#   mvn quarkus:dev -Dquarkus.profile=compose
%compose.quarkus.config.profile.parent=dev
%compose.quarkus.temporal.connection.target=${TEMPORAL_SERVER_URL:localhost:7233}
%compose.quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4317}
%compose.quarkus.observability.enabled=false

# OpenTelemetry - export all three signals, not just traces
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# Temporal server and service settings
# Name of the task queue to listen for work to do
quarkus.temporal.namespace=default
quarkus.temporal.worker.task-queue=notification-tasks
quarkus.temporal.workflow.workflow-task-timeout=5s
quarkus.grpc.server.use-separate-server=false

# Mailer - the Mailpit Dev Service supplies host/port automatically. Under the
# compose profile it is switched off so it does not fight the compose Mailpit
# for port 2025, and the SMTP connection details below are used instead.
quarkus.mailer.from=${SMTP_FROM_ADDRESS:"Petstore Support" <support@petstore.com>}
quarkus.mailer.mock=${SMTP_MOCK_SEND:false}
%compose.quarkus.mailpit.enabled=false
%compose.quarkus.mailer.auth-methods=${SMTP_AUTH_METHODS:}
%compose.quarkus.mailer.host=${SMTP_HOST:localhost}
%compose.quarkus.mailer.port=${SMTP_PORT:2025}
%compose.quarkus.mailer.start-tls=${SMTP_START_TLS:OPTIONAL}
%compose.quarkus.mailer.username=${SMTP_USER:null}
%compose.quarkus.mailer.password=${SMTP_PASSWROD:null}
